name: Refresh Backend Lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile with npm
        run: npm --prefix backend install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Refresh backend lockfile for security overrides"
          git push origin "HEAD:${GITHUB_HEAD_REF:-production-hardening-20260923}"
