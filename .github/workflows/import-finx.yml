name: Import FinX source

on:
  push:
    paths:
      - ".finx-import/READY"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .finx-import/chunk-* > /tmp/finx.b64
          base64 -d /tmp/finx.b64 > /tmp/finx.tar.gz
          mkdir -p /tmp/finx-src
          tar -xzf /tmp/finx.tar.gz -C /tmp/finx-src

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .finx-import ! -name .finx-upload -exec rm -rf {} +
          cp -a /tmp/finx-src/. .
          rm -rf .finx-import .finx-upload

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import FinX Marketing application" || exit 0
          git push
